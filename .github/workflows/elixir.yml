name: Elixir CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04

    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
          # Latest, also runs lint, audit and coverage
          - elixir: "1.20"
            otp: "29"
            latest: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        if: matrix.latest
        run: mix deps.unlock --check-unused

      - name: Check for security advisories and retired packages
        if: matrix.latest
        run: mix hex.audit

      - name: Check formatting
        if: matrix.latest
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        if: ${{ !matrix.latest }}
        run: mix test

      - name: Run tests with coverage
        if: matrix.latest
        run: mix coveralls.github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
